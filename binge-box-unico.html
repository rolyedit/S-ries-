  <script>

function normalize(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}
function searchCatalog(query) {
  const q = normalize(query);
  if (!q) return [];
  return catalog.filter(t =>
    normalize(t.title).includes(q) ||
    (t.originalTitle && normalize(t.originalTitle).includes(q))
  );
}
function byCategory(items) {
  return {
    series: items.filter(t => t.category === 'serie'),
    animes: items.filter(t => t.category === 'anime'),
    desenhos: items.filter(t => t.category === 'desenho'),
  };
}
// remove sparse holes if any
for (let i = catalog.length - 1; i >= 0; i--) {
  if (!catalog[i] || !catalog[i].id) catalog.splice(i, 1);
}

// ─── State ───────────────────────────────────────────────────────
function loadTheme() {
  try {
    const t = localStorage.getItem('binge-theme');
    if (t === 'dark' || t === 'light' || t === 'default') return t;
  } catch {}
  return 'default';
}

const state = {
  view: 'home',
  sidebarFilter: 'all',
  searchQuery: '',
  theme: loadTheme(),
  rankingOpen: false,
  selectedId: null,
  mobileSidebarOpen: false,
  settingsOpen: false,
};

function setTheme(theme) {
  try { localStorage.setItem('binge-theme', theme); } catch {}
  if (theme === 'default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  state.theme = theme;
}

function catLabel(c) {
  return c === 'serie' ? 'Série' : c === 'anime' ? 'Anime' : 'Desenho';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function posterFallback(title) {
  return 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect fill="#1d123d" width="100%" height="100%"/><text x="50%" y="50%" fill="#fff" text-anchor="middle" font-size="14">${title}</text></svg>`
  );
}

// ─── Render pieces ───────────────────────────────────────────────

    ['home','HOME'],['series','SÉRIES'],['animes','ANIMES'],['desenhos','DESENHOS'],['contato','CONTATO']

    <button type="button" data-action="setView" data-view="${id}"
      class="rounded-full px-3.5 py-1.5 text-sm font-semibold transition ${state.view===id?'bg-white/15 text-white':'text-white/70 hover:bg-white/10 hover:text-white'}">
      ${label}
    </button>`).join('');

  const themes = [
    ['default','Restaurar padrão'],['dark','Escuro'],['light','Claro']

  const themeMenu = state.settingsOpen ? `

        <button type="button" data-action="setTheme" data-theme="${id}"
          class="flex w-full px-4 py-2.5 text-left text-sm transition hover:bg-white/10 ${state.theme===id?'font-semibold text-cta':'text-white/85'}">

function renderSidebarContent() {
  const FILTERS = [
    ['all','Todos','📺'],['recent','Lançamentos recentes','✨'],
    ['airing','Em exibição','⏳'],['finished','Finalizados','✅']
  ];
  const filters = FILTERS.map(([id,label,emoji]) => `
    <li>
      <button type="button" data-action="setFilter" data-filter="${id}"
        class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-left text-sm font-medium transition ${state.sidebarFilter===id?'bg-cta text-white shadow-md':'text-white/75 hover:bg-white/10 hover:text-white'}">
        <span>${emoji}</span>${label}
      </button>
    </li>`).join('');

  const navMobile = [
    ['home','HOME'],['series','SÉRIES'],['animes','ANIMES'],['desenhos','DESENHOS'],['contato','CONTATO']
  ].map(([id,label]) => `
    <button type="button" data-action="setView" data-view="${id}"
      class="flex w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold ${state.view===id?'bg-white/15 text-white':'text-white/70 hover:bg-white/10'}">${label}</button>`).join('');

  return `
    <div class="mb-5 flex items-center justify-between px-1">
      <h2 class="text-xs font-bold uppercase tracking-widest text-white/50">Destaques e status</h2>
      <button type="button" data-action="closeSidebar" class="rounded-lg p-1.5 hover:bg-white/10 lg:hidden" aria-label="Fechar">${icons.x(18)}</button>
    </div>
    <ul class="space-y-1">${filters}</ul>
    <div class="mt-8 border-t border-white/10 pt-5 lg:hidden">
      <p class="mb-2 px-1 text-xs font-bold uppercase tracking-widest text-white/50">Navegação</p>
      ${navMobile}
    </div>`;
}

function renderSidebar() {
  return `
  <aside class="sticky top-[65px] hidden h-[calc(100vh-65px)] w-56 shrink-0 overflow-y-auto border-r border-white/10 p-4 lg:block"
    style="background:var(--nav);color:var(--nav-fg)">${renderSidebarContent()}</aside>
  ${state.mobileSidebarOpen ? `
  <div class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-black/50" data-action="closeSidebar"></div>
    <aside class="absolute left-0 top-0 h-full w-64 overflow-y-auto p-4 shadow-2xl" style="background:var(--nav);color:var(--nav-fg)">
      ${renderSidebarContent()}
    </aside>
  </div>` : ''}`;
}

function renderCard(item) {
  return `
  <button type="button" data-action="select" data-id="${item.id}"
    class="card-surface group flex flex-col overflow-hidden text-left transition hover:-translate-y-1 hover:shadow-lg">
    <div class="relative aspect-[2/3] overflow-hidden bg-[#1d123d]/10">
      <img src="${esc(item.poster)}" alt="${esc(item.title)}" loading="lazy"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
        onerror="this.style.display='none';const p=this.parentElement;if(p&&!p.querySelector('.fallback')){const d=document.createElement('div');d.className='fallback flex h-full w-full items-center justify-center bg-gradient-to-br from-[#1d123d] to-[#3b2066] p-3 text-center text-sm font-semibold text-white/80';d.textContent=this.alt;p.appendChild(d);}" />
      <span class="absolute right-2 top-2 flex items-center gap-1 rounded-full bg-black/70 px-2 py-0.5 text-xs font-bold text-amber-300">
        ${icons.star(11)} ${item.rating.toFixed(1)}
      </span>
    </div>
    <div class="flex flex-1 flex-col gap-1 p-3">
      <h3 class="line-clamp-2 text-sm font-bold leading-snug" style="color:var(--fg)">${esc(item.title)}</h3>
      <p class="text-xs" style="color:var(--muted)">${item.year} · ${catLabel(item.category)}</p>
    </div>
  </button>`;
}

function renderSection(title, emoji, items) {
  if (!items.length) return '';
  return `
  <section class="mb-10">
    <h2 class="mb-4 flex items-center gap-2 text-lg font-bold" style="color:var(--fg)">
      <span>${emoji}</span> ${title}
      <span class="text-sm font-normal" style="color:var(--muted)">(${items.length})</span>
    </h2>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">
      ${items.map(renderCard).join('')}
    </div>
  </section>`;
}

function filterByView(items, view) {
  if (view === 'series') return items.filter(t => t.category === 'serie');
  if (view === 'animes') return items.filter(t => t.category === 'anime');
  if (view === 'desenhos') return items.filter(t => t.category === 'desenho');
  return items;
}

function renderCatalog() {
  if (state.searchQuery.trim()) {
    const results = searchCatalog(state.searchQuery);
    return `
    <div>
      <h2 class="mb-4 text-lg font-bold" style="color:var(--fg)">
        Resultados para “${esc(state.searchQuery)}”
        <span class="ml-2 text-sm font-normal" style="color:var(--muted)">(${results.length})</span>
      </h2>
      ${results.length === 0
        ? `<p style="color:var(--muted)">Nenhum título encontrado.</p>`
        : `<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">${results.map(renderCard).join('')}</div>`}
    </div>`;
  }

  let base = filterByView(catalog, state.view);
  if (state.sidebarFilter === 'recent') base = base.filter(t => t.tags.includes('recent'));
  else if (state.sidebarFilter === 'airing') base = base.filter(t => t.tags.includes('airing'));
  else if (state.sidebarFilter === 'finished') base = base.filter(t => t.tags.includes('finished'));

  if (state.sidebarFilter === 'finished' || state.sidebarFilter === 'airing') {
    const groups = byCategory(base);
    const label = state.sidebarFilter === 'finished'
      ? 'PRODUÇÕES QUE JÁ ACABARAM (FINALIZADAS)'
      : 'PRODUÇÕES QUE AINDA NÃO ACABARAM (ATIVAS / EM ANDAMENTO)';
    return `
    <div>
      <h2 class="mb-6 text-xl font-extrabold" style="color:var(--fg)">${label}</h2>
      ${renderSection('Séries Live-Action','🎬', groups.series)}
      ${renderSection('Animes','➿', groups.animes)}
      ${renderSection('Desenhos Ocidentais','🎨', groups.desenhos)}
    </div>`;
  }

  const titleMap = {
    home: 'Catálogo completo',
    series: 'Séries Live-Action',
    animes: 'Animes',
    desenhos: 'Desenhos Ocidentais',
  };
  return `
  <div>
    <h2 class="mb-4 text-lg font-bold" style="color:var(--fg)">
      ${titleMap[state.view] || 'Catálogo'}
      <span class="ml-2 text-sm font-normal" style="color:var(--muted)">(${base.length})</span>
    </h2>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">
      ${base.map(renderCard).join('')}
    </div>
  </div>`;
}

function renderContact() {
  return `
  <div class="mx-auto max-w-lg">
    <h2 class="mb-2 text-2xl font-extrabold" style="color:var(--fg)">Contato</h2>
    <p class="mb-8 text-sm" style="color:var(--muted)">Sugestões de títulos, correções ou feedback sobre o BINGE BOX? Fale com a gente.</p>
    <form class="card-surface space-y-4 p-6" id="contactForm">
      <div>
        <label class="mb-1 block text-sm font-semibold" style="color:var(--fg)">Nome</label>
        <input required class="w-full rounded-xl border px-3 py-2.5 text-sm outline-none focus:border-cta"
          style="background:var(--bg);border-color:var(--border);color:var(--fg)" placeholder="Seu nome" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold" style="color:var(--fg)">E-mail</label>
        <input type="email" required class="w-full rounded-xl border px-3 py-2.5 text-sm outline-none focus:border-cta"
          style="background:var(--bg);border-color:var(--border);color:var(--fg)" placeholder="voce@email.com" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-semibold" style="color:var(--fg)">Mensagem</label>
        <textarea required rows="4" class="w-full resize-none rounded-xl border px-3 py-2.5 text-sm outline-none focus:border-cta"
          style="background:var(--bg);border-color:var(--border);color:var(--fg)" placeholder="Sua mensagem..."></textarea>
      </div>
      <button type="submit" class="btn-cta w-full">Enviar</button>
    </form>
    <div class="mt-8 flex flex-wrap gap-4 text-sm" style="color:var(--muted)">
      <span class="flex items-center gap-1.5">${icons.mail} contato@bingebox.dev</span>
      <span class="flex items-center gap-1.5">${icons.message} Discord (em breve)</span>
      <span class="flex items-center gap-1.5">${icons.github} open source</span>
    </div>
  </div>`;
}

function renderTitleModal() {
  const item = catalog.find(t => t.id === state.selectedId);
  if (!item) return '';
  const status = item.tags.includes('airing') ? 'Em exibição' : item.tags.includes('finished') ? 'Finalizada' : '';
  return `
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 p-4" data-action="closeModal">
    <div class="card-surface relative flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden shadow-2xl md:flex-row" data-stop>
      <button type="button" data-action="closeModal" class="absolute right-3 top-3 z-10 rounded-full bg-black/50 p-1.5 text-white hover:bg-black/70" aria-label="Fechar">${icons.x(18)}</button>
      <div class="h-48 w-full shrink-0 md:h-auto md:w-56">
        <img src="${esc(item.poster)}" alt="${esc(item.title)}" class="h-full w-full object-cover"
          onerror="this.src='${posterFallback(item.title)}'" />
      </div>
      <div class="flex flex-1 flex-col gap-3 overflow-y-auto p-5">
        <div>
          <h2 class="text-xl font-extrabold" style="color:var(--fg)">${esc(item.title)}</h2>
          ${item.originalTitle ? `<p class="text-sm" style="color:var(--muted)">${esc(item.originalTitle)}</p>` : ''}
        </div>
        <div class="flex flex-wrap gap-2 text-xs font-semibold">
          <span class="rounded-full bg-cta/15 px-2.5 py-1 text-cta">${catLabel(item.category)}</span>
          ${status ? `<span class="rounded-full px-2.5 py-1" style="background:var(--border);color:var(--fg)">${status}</span>` : ''}
          <span class="flex items-center gap-1 rounded-full px-2.5 py-1" style="background:var(--border);color:var(--fg)">
            <span class="text-amber-500">${icons.star(12)}</span> ${item.rating.toFixed(1)}
          </span>
          <span class="rounded-full px-2.5 py-1" style="background:var(--border);color:var(--fg)">${item.year}</span>
        </div>
        <p class="text-sm leading-relaxed" style="color:var(--muted)">${esc(item.synopsis)}</p>
      </div>
    </div>
  </div>`;
}

function renderRankingModal() {
  if (!state.rankingOpen) return '';
  const rows = top30.map((item, i) => `
    <li>
      <button type="button" data-action="selectFromRank" data-id="${item.id}"
        class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-black/5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-extrabold ${i<3?'bg-cta text-white':''}"
          ${i>=3?`style="background:var(--border);color:var(--fg)"`:''}>${i+1}</span>
        <img src="${esc(item.poster)}" alt="" class="h-12 w-8 shrink-0 rounded object-cover"
          onerror="this.style.visibility='hidden'" />
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-bold" style="color:var(--fg)">${esc(item.title)}</p>
          <p class="text-xs" style="color:var(--muted)">${catLabel(item.category)} · ${item.year}</p>
        </div>
        <span class="flex items-center gap-1 text-sm font-bold text-amber-500">${icons.star(13)} ${item.rating.toFixed(1)}</span>
      </button>
    </li>`).join('');

  return `
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 p-4" data-action="closeRanking">
    <div class="card-surface relative flex max-h-[90vh] w-full max-w-lg flex-col shadow-2xl" data-stop>
      <div class="flex items-center justify-between border-b px-5 py-4" style="border-color:var(--border)">
        <h2 class="text-lg font-extrabold" style="color:var(--fg)">🏆 Top 30 — BINGE BOX</h2>
        <button type="button" data-action="closeRanking" class="rounded-full p-1.5 hover:opacity-70" style="color:var(--fg)" aria-label="Fechar">${icons.x(18)}</button>
      </div>
      <ol class="flex-1 overflow-y-auto p-2">${rows}</ol>
    </div>
  </div>`;
}

function render() {
  const showHero = state.view === 'home' && !state.searchQuery.trim();
  const root = document.getElementById('root');
  const prevScroll = window.scrollY;
  const searchFocused = document.activeElement && document.activeElement.id === 'searchInput';
  const searchSel = searchFocused ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;

  root.innerHTML = `
  <div class="min-h-screen" style="background:var(--bg)">
    ${renderNavbar()}
    <div class="mx-auto flex max-w-[1400px]">
      ${renderSidebar()}
      <main class="min-w-0 flex-1 px-4 py-6 md:px-6">
        ${state.view === 'contato' ? renderContact() : `
          ${showHero ? `<div class="mb-8">${renderHero()}</div>` : ''}
          ${renderCatalog()}
        `}
      </main>
    </div>
    ${renderTitleModal()}
    ${renderRankingModal()}
  </div>`;

  window.scrollTo(0, prevScroll);
  if (searchFocused) {
    const inp = document.getElementById('searchInput');
    if (inp) {
      inp.focus();
      if (searchSel) try { inp.setSelectionRange(searchSel[0], searchSel[1]); } catch {}
    }
  }
}

// ─── Events ──────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  // Close settings when clicking outside
  if (state.settingsOpen && !e.target.closest('#settingsWrap')) {
    state.settingsOpen = false;
    // re-render only if no other action
    if (!e.target.closest('[data-action]')) {
      render();
      return;
    }
  }

  // Clicks inside modal panel should not close via backdrop
  if (e.target.closest('[data-stop]') && e.target.closest('[data-action="closeModal"], [data-action="closeRanking"]') === null) {
    // allow buttons inside modal that have their own data-action
    const inner = e.target.closest('[data-action]');
    if (!inner || inner.getAttribute('data-action') === 'closeModal' || inner.getAttribute('data-action') === 'closeRanking') {
      if (!inner) return;
    }
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;

  // If backdrop action but click originated inside data-stop (and not a close button), ignore
  const action = el.getAttribute('data-action');
  if ((action === 'closeModal' || action === 'closeRanking') && e.target.closest('[data-stop]') && el.tagName !== 'BUTTON') {
    return;
  }

  switch (action) {
    case 'setView':
      state.view = el.getAttribute('data-view');
      state.searchQuery = '';
      state.sidebarFilter = 'all';
      state.mobileSidebarOpen = false;
      state.settingsOpen = false;
      break;
    case 'setFilter':
      state.sidebarFilter = el.getAttribute('data-filter');
      state.searchQuery = '';
      state.mobileSidebarOpen = false;
      break;
    case 'setTheme':
      setTheme(el.getAttribute('data-theme'));
      state.settingsOpen = false;
      break;
    case 'toggleSettings':
      state.settingsOpen = !state.settingsOpen;
      break;
    case 'openSidebar':
      state.mobileSidebarOpen = true;
      break;
    case 'closeSidebar':
      state.mobileSidebarOpen = false;
      break;
    case 'openRanking':
      state.rankingOpen = true;
      break;
    case 'closeRanking':
      state.rankingOpen = false;
      break;
    case 'select':
      state.selectedId = el.getAttribute('data-id');
      break;
    case 'selectFromRank':
      state.rankingOpen = false;
      state.selectedId = el.getAttribute('data-id');
      break;
    case 'closeModal':
      state.selectedId = null;
      break;
    case 'clearSearch':
      state.searchQuery = '';
      break;
    default:
      return;
  }
  render();
});

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'searchInput') {
    state.searchQuery = e.target.value;
    render();
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'contactForm') {
    e.preventDefault();
    alert('Mensagem enviada! (demo)');
  }
});

render();
  </script>
</body>
</html>
